server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # --- Content-Security-Policy (Report-Only — observar antes de bloquear) ---
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://connect.facebook.net https://www.facebook.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache largo para assets estáticos
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Descargas: sin fallback a index.html — si no existe, 404 honesto
    location ^~ /descargas/ {
        try_files $uri =404;
    }

    # --- Canje de códigos del portal (proxy a n8n, misma origin → sin tocar CSP) ---
    # ACTIVAR cuando el workflow WF-Taller-Codigos esté live:
    # 1) descomentar el bloque, 2) poner la Production URL real del webhook,
    # 3) poner API_ACTIVA=true en onboarding.html, 4) push + Deploy.
    #location = /api/codigo {
    #    proxy_pass https://n8n-n8n.4nwivb.easypanel.host/webhook/UUID-PENDIENTE;
    #    proxy_set_header Host n8n-n8n.4nwivb.easypanel.host;
    #    proxy_ssl_server_name on;
    #}

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
