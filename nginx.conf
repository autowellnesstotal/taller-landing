# Zona de rate limit (contexto http: este archivo se incluye dentro de http{})
# 20 req/min por IP para los endpoints de API.
limit_req_zone $binary_remote_addr zone=apilim:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # --- Content-Security-Policy (Report-Only — observar antes de bloquear) ---
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://connect.facebook.net https://www.facebook.com; frame-ancestors 'self'; form-action 'self' https://mpago.li; base-uri 'self'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- Bloquear archivos internos (va ANTES de las reglas de cache) ---
    # El Dockerfile hace COPY . así que .git/, nginx.conf y demás quedan dentro
    # del docroot. Sin esto, /.git/config y /nginx.conf se sirven al público
    # (este último revela las URLs de los webhooks de n8n).
    location ~ /\. { deny all; }
    location ~* ^/(nginx\.conf|Dockerfile|docker-compose\.ya?ml|README(\.md)?|package(-lock)?\.json)$ { deny all; }

    # --- Canje de códigos del portal (proxy a n8n, misma origin → sin tocar CSP) ---
    # Rate limit: evita enumerar códigos por fuerza bruta.
    location = /api/codigo {
        limit_req zone=apilim burst=10 nodelay;
        proxy_pass https://n8n-n8n.4nwivb.easypanel.host/webhook/taller-codigo;
        proxy_set_header Host n8n-n8n.4nwivb.easypanel.host;
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
    }

    # --- Contador de la promo early-bird (GET, cuenta ventas de $990) ---
    location = /api/promo {
        limit_req zone=apilim burst=20 nodelay;
        proxy_pass https://n8n-n8n.4nwivb.easypanel.host/webhook/taller-promo;
        proxy_set_header Host n8n-n8n.4nwivb.easypanel.host;
        proxy_ssl_server_name on;
    }

    # Descargas: sin fallback a index.html — si no existe, 404 honesto
    location ^~ /descargas/ {
        try_files $uri =404;
    }

    # Cache largo para assets estáticos
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
